<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5ECE9">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="R.FIT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta property="og:image" content="icons/icon-512.png">
<meta property="og:title" content="R.FIT · Moda Fitness">
<meta property="og:description" content="Veja as peças da R.FIT e faça seu pedido pelo WhatsApp">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>R.FIT · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Tenor+Sans&display=swap">
<style id="rfit-style">
/* Layout: blush showroom wall — wordmark header, sticky category rail, 2→4 col photo grid, bottom sheets for detail/bag/edit */
:root{
  --bg:#F5ECE9; --surface:#FCF8F6; --ink:#3A241D; --muted:#86695F; --accent:#93543A; --accent-ink:#FFF8F4;
  --line:#E5D3CD; --chip:#EFE1DC; --ok:#2F7A55; --warn:#A5452F; --shadow:rgba(58,36,29,.14); --scrim:rgba(40,24,19,.45);
  --display:"Tenor Sans","Jost","Avenir Next","Segoe UI",sans-serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1412; --surface:#251C19; --ink:#F2E5DF; --muted:#B39A91; --accent:#D69B7A; --accent-ink:#22150F;
  --line:#3A2D29; --chip:#30241F; --ok:#6CC59A; --warn:#E58A72; --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1412; --surface:#251C19; --ink:#F2E5DF; --muted:#B39A91; --accent:#D69B7A; --accent-ink:#22150F;
  --line:#3A2D29; --chip:#30241F; --ok:#6CC59A; --warn:#E58A72; --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{padding-block:28px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.brand{font-family:var(--display);font-weight:400;font-size:clamp(40px,9vw,64px);letter-spacing:.08em;line-height:1;margin:0;
  background:linear-gradient(90deg,var(--ink) 0%,var(--accent) 55%,var(--ink) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin:0;padding-left:.42em}
.notice{margin:10px 0 0;font-size:14px;color:var(--ink);background:var(--chip);border-radius:999px;padding:6px 14px;max-width:100%}
.adminbtn{position:absolute;right:0;top:20px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;gap:6px;align-items:center}
.adminbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* category rail */
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.rail .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.rail .wrap::-webkit-scrollbar{display:none}
.chipbtn{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pdfbtn{border-color:var(--accent);color:var(--accent)}
.search{flex:none;width:150px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}

/* admin strip */
.adminbar{margin-top:14px;background:var(--surface);border:1px dashed var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.adminbar p{margin:0;font-size:14px;color:var(--muted);min-width:0;flex:1 1 240px}
.adminbar .row{display:flex;gap:8px;flex-wrap:wrap}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding-block:18px 120px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 18px}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.card.dim{opacity:.5}
.ph{position:relative;aspect-ratio:2/3;max-width:100%;border-radius:var(--r);overflow:hidden;background:var(--chip);border:0;padding:0;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.ph:hover img{transform:scale(1.03)}
.ph .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.badges{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 8px}
.badge.new{background:var(--accent);color:var(--accent-ink)}
.badge.off{background:var(--ink);color:var(--bg)}
.cname{font-family:var(--display);font-size:15px;line-height:1.25;margin:0;text-wrap:balance}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.price{font-weight:500;font-variant-numeric:tabular-nums}
.price s{color:var(--muted);font-weight:400;font-size:13px;margin-right:4px}
.price .ask{color:var(--muted);font-weight:400;font-size:13px}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--line)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12.5px}
.mini.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.addcard{aspect-ratio:2/3;border:1.5px dashed var(--accent);border-radius:var(--r);background:transparent;color:var(--accent);display:grid;place-items:center;font-size:15px;text-align:center;padding:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}

/* bag fab */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:13px 22px;font-size:15px;box-shadow:0 8px 24px var(--shadow);display:flex;gap:10px;align-items:center;white-space:nowrap}
.fab b{font-weight:600;font-variant-numeric:tabular-nums}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:760px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:760px){.sheet{border-radius:20px;max-height:90%}}
.sheet.narrow{max-width:520px}
.shead{position:sticky;top:0;background:var(--surface);z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.shead h2{font-family:var(--display);font-weight:400;font-size:19px;margin:0;min-width:0}
.x{border:0;background:var(--chip);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.sbody{padding:18px;display:flex;flex-direction:column;gap:16px}
.detail{display:grid;gap:18px}
@media(min-width:760px){.detail{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--r);gap:6px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car img{flex:none;width:100%;aspect-ratio:2/3;object-fit:cover;scroll-snap-align:start;border-radius:var(--r);max-width:100%}
.thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumbs button{flex:none;width:46px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;border:1.5px solid transparent;padding:0;background:var(--chip)}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.dinfo{display:flex;flex-direction:column;gap:14px;min-width:0}
.dinfo .cat{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.dinfo h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.dinfo .price{font-size:20px}
.desc{margin:0;color:var(--muted);white-space:pre-line}
.lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:7px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.opt .dot{width:14px;height:14px}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:18px}
.qty span{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.big{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:13px 20px;font-size:15px;width:100%}
.big.accent{background:var(--accent);color:var(--accent-ink)}
.big:disabled{opacity:.45;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:transparent;border-radius:999px;padding:11px 18px;font-size:14px}
.danger{color:var(--warn);border-color:var(--warn)}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--warn);margin:0}

/* bag */
.line{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.line img{width:56px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;background:var(--chip)}
.line .t{font-family:var(--display);margin:0 0 2px;font-size:15px}
.line .s{font-size:13px;color:var(--muted);margin:0}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.waNum{font-size:13px;color:var(--muted);text-align:center;margin:0;user-select:all}

/* form */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f label{font-size:13px;color:var(--muted)}
.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea.in{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ephotos{display:flex;gap:8px;flex-wrap:wrap}
.ep{position:relative;width:78px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--chip)}
.ep img{width:100%;height:100%;object-fit:cover}
.ep .acts{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.6));padding:4px}
.ep .acts button{border:0;background:rgba(255,255,255,.9);color:#3A241D;border-radius:6px;font-size:11px;padding:2px 5px}
.ep .cover{position:absolute;left:4px;top:4px;font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 5px}
.upl{width:78px;aspect-ratio:2/3;border:1.5px dashed var(--accent);border-radius:10px;display:grid;place-items:center;color:var(--accent);font-size:13px;text-align:center;cursor:pointer;padding:4px}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr) 36px;gap:8px;align-items:center}
.crow input[type=color]{width:44px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--bg)}
.toggles{display:flex;flex-direction:column;gap:10px}
.tg{display:flex;align-items:center;gap:10px;font-size:14px}
.tg input{width:18px;height:18px;accent-color:var(--accent)}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.foot .grow{flex:1}
.confirm{background:var(--chip);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.busy{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;color:#fff;font-size:16px}
.foothint{text-align:center;color:var(--muted);font-size:13px;padding-block:0 110px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* PDF / impressão (Compartilhar > Exportar > PDF): cores reais, 3 por linha, peça nunca cortada */
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
    --bg:#F5ECE9; --surface:#FCF8F6; --ink:#3A241D; --muted:#86695F; --accent:#93543A; --accent-ink:#FFF8F4;
    --line:#E5D3CD; --chip:#EFE1DC; color-scheme:light}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  @page{size:A4;margin:10mm 8mm}
  html,body{background:var(--bg)!important;width:auto!important}
  :root{padding:0!important}
  body::before{display:none}
  .wrap{max-width:none!important;padding-left:0!important;padding-right:0!important}
  .top{padding-block:4mm 6mm}
  .brand{font-size:44pt}
  .rail,.fab,.adminbtn,.adminbar,.tools,.addcard,.toast,.scrim,.busy,.card.dim,.empty,.pdfbtn{display:none!important}
  .grid{display:block!important;padding-block:0!important;font-size:0}
  .card{display:inline-block!important;vertical-align:top;width:31%;margin:0 1.1% 7mm;font-size:11pt;
        break-inside:avoid!important;page-break-inside:avoid!important}
  .card > *{margin-bottom:2mm}
  .ph{aspect-ratio:auto;height:82mm;border-radius:3mm}
  .ph img{transform:none!important;height:82mm}
  .cname{font-size:12pt}
  .price,.price .ask{font-size:10.5pt}
  .dot{width:10px;height:10px;border-color:rgba(58,36,29,.25)}
  .foothint{font-size:9pt;padding-block:2mm 0}
}
</style>
</head>
<body>
<div id="app"></div>
<script id="rfit-app">
(function(){
"use strict";
var REPO="michaelgyn1/rfit-catalogo", API="https://api.github.com/repos/"+REPO+"/contents/";
var STATE = {v:1,settings:{storeName:"R.FIT",tagline:"Moda Fitness",notice:"",whatsapp:"",instagram:""},products:[],photos:{}};
var loaded=false, dataSha=null;
function ls(k,v){try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v) }catch(e){return null}}
var token = ls("rfit-token");
var SIZES = ["PP","P","M","G","GG","XG","U"];
var ui = { cat:"Todos", q:"", admin:false, canEdit:false, sheet:null, bag:[] };

function ss(k,v){try{ if(v===undefined){var x=sessionStorage.getItem(k);return x?JSON.parse(x):null} sessionStorage.setItem(k,JSON.stringify(v)) }catch(e){return null}}
var saved = ss("rfit-ui"), wantAdmin=false; if(saved){ ui.cat=saved.cat||"Todos"; }
ui.bag = ss("rfit-bag") || [];
if(saved && saved.toast) setTimeout(function(){toast(saved.toast)},300);
if(saved){ ss("rfit-ui",{admin:wantAdmin,cat:ui.cat}); if(saved.y) setTimeout(function(){window.scrollTo(0,saved.y)},60); }

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function money(n){return BRL.format(n)}
function parseMoney(s){ s=String(s||"").replace(/[^\d,.-]/g,""); if(!s) return null; if(s.indexOf(",")>-1) s=s.replace(/\./g,"").replace(",","."); var n=parseFloat(s); return isFinite(n)&&n>0?Math.round(n*100)/100:null }
function moneyIn(n){return n==null?"":n.toFixed(2).replace(".",",")}
function uid(){return Math.random().toString(36).slice(2,9)}
function pById(id){for(var i=0;i<STATE.products.length;i++) if(STATE.products[i].id===id) return STATE.products[i]; return null}
function img(p,i){var id=p.photos[i||0]; return id && STATE.photos[id] ? STATE.photos[id] : ""}
function eff(p){return p.promo!=null && p.price!=null && p.promo<p.price ? p.promo : p.price}
function priceHtml(p){
  if(p.price==null) return '<span class="price"><span class="ask">Consulte o valor</span></span>';
  if(p.promo!=null && p.promo<p.price) return '<span class="price"><s>'+money(p.price)+'</s>'+money(p.promo)+'</span>';
  return '<span class="price">'+money(p.price)+'</span>';
}
function cats(){var seen={},out=[];STATE.products.forEach(function(p){if((ui.admin||!p.hidden)&&p.category&&!seen[p.category]){seen[p.category]=1;out.push(p.category)}});return out}
function visible(){
  var q=ui.q.trim().toLowerCase();
  return STATE.products.filter(function(p){
    if(p.hidden && !ui.admin) return false;
    if(ui.cat!=="Todos" && p.category!==ui.cat) return false;
    if(q && (p.name+" "+p.category+" "+p.colors.map(function(c){return c.n}).join(" ")).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}

var app = document.getElementById("app");
function render(){
  var s=STATE.settings, list=visible(), cs=cats();
  if(ui.cat!=="Todos" && cs.indexOf(ui.cat)<0) ui.cat="Todos";
  var h='';
  h+='<header class="wrap top">';
  if(ui.canEdit) h+='<button class="adminbtn'+(ui.admin?' on':'')+'" data-a="toggleAdmin" aria-pressed="'+ui.admin+'">'+(ui.admin?'✓ Editando':'✎ Editar')+'</button>';
  h+='<h1 class="brand">'+esc(s.storeName)+'</h1><p class="tag">'+esc(s.tagline)+'</p>';
  if(s.notice) h+='<p class="notice">'+esc(s.notice)+'</p>';
  h+='</header>';
  h+='<nav class="rail" aria-label="Categorias"><div class="wrap">';
  ["Todos"].concat(cs).forEach(function(c){h+='<button class="chipbtn" data-a="cat" data-v="'+esc(c)+'" aria-pressed="'+(ui.cat===c)+'">'+esc(c)+'</button>'});
  h+='<input class="search" id="q" type="search" placeholder="Buscar peça ou cor" value="'+esc(ui.q)+'" aria-label="Buscar">';
  if(canInstall()) h+='<button class="chipbtn pdfbtn" data-a="install">Instalar app</button>';
  if(loaded&&STATE.products.length) h+='<button class="chipbtn pdfbtn" data-a="pdf">↓ PDF '+(ui.cat==="Todos"?'do catálogo':'de '+esc(ui.cat))+'</button>';
  h+='</div></nav>';
  h+='<main class="wrap">';
  if(ui.admin){
    var hid=STATE.products.filter(function(p){return p.hidden}).length;
    h+='<div class="adminbar"><p>Modo edição: só você vê os botões. Toque em <b>Editar</b> numa peça para mudar foto, preço, cores ou tamanhos. Ao salvar, o site das clientes atualiza em cerca de 1 minuto.'+(hid?' Peças ocultas aparecem apagadas.':'')+'</p><div class="row"><button class="mini primary" data-a="new">+ Nova peça</button><button class="mini" data-a="settings">Dados da loja</button><button class="mini" data-a="logout">Sair</button></div></div>';
  }
  h+='<section class="grid" id="grid">';
  if(ui.admin && ui.cat==="Todos" && !ui.q) h+='<button class="addcard" data-a="new">+ Adicionar nova peça</button>';
  list.forEach(function(p){
    var cover=img(p,0);
    h+='<article class="card'+(p.hidden?' dim':'')+'">';
    h+='<button class="ph" data-a="open" data-id="'+p.id+'" aria-label="Ver '+esc(p.name)+'">'+(cover?'<img src="'+cover+'" alt="'+esc(p.name)+'">':'<span class="noimg">Sem foto</span>');

/* ---------- GitHub ---------- */
function gh(path,opts){
  opts=opts||{};
  var h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token};
  if(opts.body) h["Content-Type"]="application/json";
  return fetch(path.indexOf("http")===0?path:API+path,{method:opts.method||"GET",headers:h,body:opts.body?JSON.stringify(opts.body):undefined,cache:"no-store"})
    .then(function(r){ if(!r.ok){var e=new Error("http "+r.status);e.status=r.status;throw e} return r.status===204?null:r.json() });
}
function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
function utf8b64(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,""))))}
function loadPublic(){

var saving=false;
function commit(next,msg){
  if(saving) return Promise.resolve(false);
  if(!token){toast("Entre no modo edição primeiro.");return Promise.resolve(false)}
  saving=true; var busy=document.createElement("div");busy.className="busy";busy.textContent="Salvando…";document.body.appendChild(busy);
  var used={};next.products.forEach(function(p){p.photos.forEach(function(id){used[id]=1})});
  var uploads=Object.keys(next.photos).filter(function(k){return used[k]&&String(next.photos[k]).indexOf("data:")===0});
  var n=0;
  return uploads.reduce(function(pr,k){return pr.then(function(){
      n++;busy.textContent="Enviando foto "+n+" de "+uploads.length+"…";
      var path="img/"+k+".jpg";
      return gh(path,{method:"PUT",body:{message:"Foto "+k,content:next.photos[k].split(",")[1],branch:"main"}}).then(function(){next.photos[k]=path});
    })},Promise.resolve())
  .then(function(){
    busy.textContent="Salvando catálogo…";
    var photos={};Object.keys(next.photos).forEach(function(k){if(used[k])photos[k]=next.photos[k]});
    var clean={v:1,settings:next.settings,products:next.products,photos:photos};
    return gh("data.json",{method:"PUT",body:{message:msg||"Atualiza catálogo",content:b64utf8(JSON.stringify(clean,null,1)),sha:dataSha,branch:"main"}})
      .then(function(r){dataSha=r.content.sha;STATE=clean;});
  })
  .then(function(){saving=false;busy.remove();ui.sheet=null;render();toast((msg||"Salvo")+". O site das clientes atualiza em cerca de 1 minuto.");return true},
  function(e){
    saving=false;busy.remove();
    if(e.status===401||e.status===403){toast("Sua chave de acesso não vale mais. Entre de novo.");logout()}
    else if(e.status===409||e.status===422){toast("O catálogo mudou em outro aparelho. Recarregando…");setTimeout(function(){boot()},1200)}
    else toast("Não salvou. Verifique a internet e tente de novo.");
    return false;
  });
}

/* ---------- PDF do catálogo (gerado aqui, layout A4 fixo) ---------- */
function loadJsPdf(){
  if(window.jspdf) return Promise.resolve();
  return new Promise(function(res,rej){var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
}
function crop23(src){
  return new Promise(function(res){
    if(!src){res(null);return}
    var im=new Image();
    im.onload=function(){var W=600,H=900,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
      var s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);res(c.toDataURL("image/jpeg",0.8))};
    im.onerror=function(){res(null)};im.src=src;
  });
}
function rgb(hex){hex=String(hex||"#999999").replace("#","");if(hex.length===3)hex=hex.replace(/./g,"$&$&");var n=parseInt(hex,16);return [(n>>16)&255,(n>>8)&255,n&255]}
function makePdf(){
  var s=STATE.settings;
  var list=STATE.products.filter(function(p){return !p.hidden && (ui.cat==="Todos"||p.category===ui.cat)});
  if(!list.length){toast("Nenhuma peça para colocar no PDF.");return Promise.resolve()}
  var groups=[],gi={};list.forEach(function(p){var c=p.category||"Outros";if(!(c in gi)){gi[c]=groups.length;groups.push({c:c,items:[]})}groups[gi[c]].items.push(p)});
  return loadJsPdf().then(function(){
    return Promise.all(list.map(function(p){return crop23(img(p,0))}));
  }).then(function(crops){
    var cmap={};list.forEach(function(p,i){cmap[p.id]=crops[i]});
    var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
    var BG=[245,236,233],INK=[58,36,29],MUT=[134,105,95],ACC=[147,84,58],LINE=[229,211,205];
    var PW=210,PH=297,M=14,G=6,CW=(PW-2*M-2*G)/3,PHT=CW*1.5,CH=PHT+27,page=1;
    var contact=[s.whatsapp?"WhatsApp "+fmtPhone(s.whatsapp):"",s.instagram?"Instagram "+s.instagram:""].filter(Boolean).join("   ·   ");
    function bg(){doc.setFillColor.apply(doc,BG);doc.rect(0,0,PW,PH,"F")}
    function chrome(){
      doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor.apply(doc,ACC);doc.text(s.storeName,M,10,{charSpace:1.2});
      doc.setTextColor.apply(doc,MUT);doc.setFontSize(7.5);doc.text(s.tagline.toUpperCase(),PW-M,10,{align:"right",charSpace:1});
      doc.setDrawColor.apply(doc,LINE);doc.setLineWidth(.3);doc.line(M,13,PW-M,13);
      doc.setFontSize(8);if(contact)doc.text(contact,M,PH-8);doc.text(String(page),PW-M,PH-8,{align:"right"});
    }
    // capa
    bg();
    doc.setTextColor.apply(doc,INK);doc.setFont("helvetica","normal");doc.setFontSize(60);
    doc.text(s.storeName,PW/2,58,{align:"center",charSpace:4});
    doc.setFontSize(10);doc.setTextColor.apply(doc,MUT);doc.text(s.tagline.toUpperCase(),PW/2,70,{align:"center",charSpace:3.2});
    var covers=list.slice(0,3),cw2=(PW-2*M-2*G)/3;
    covers.forEach(function(p,i){var c=cmap[p.id];if(c)doc.addImage(c,"JPEG",M+i*(cw2+G),84,cw2,cw2*1.5)});
    var y0=84+cw2*1.5+16;
    doc.setTextColor.apply(doc,INK);doc.setFontSize(13);
    if(s.notice) doc.text(s.notice,PW/2,y0,{align:"center"});
    doc.setFontSize(10);doc.setTextColor.apply(doc,MUT);
    var mes=new Date().toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    doc.text("Catálogo "+(ui.cat!=="Todos"?ui.cat+" · ":"")+mes,PW/2,y0+9,{align:"center"});
    if(contact) doc.text(contact,PW/2,PH-18,{align:"center"});
    // peças
    var col=0,y=0,LIM=PH-14;
    function newPage(){doc.addPage();page++;bg();chrome();col=0;y=22}
    newPage();
    groups.forEach(function(g,gix){
      if(col>0){col=0;y+=CH+6}
      if(gix>0 && y+12+CH>LIM) newPage();
      doc.setFont("helvetica","normal");doc.setFontSize(17);doc.setTextColor.apply(doc,INK);doc.text(g.c,M,y+6,{charSpace:.6});
      y+=12;
      g.items.forEach(function(p){
        if(col===0 && y+CH>LIM){newPage()}
        var x=M+col*(CW+G),cy=y,c=cmap[p.id];
        if(c) doc.addImage(c,"JPEG",x,cy,CW,PHT); else {doc.setFillColor(239,225,220);doc.rect(x,cy,CW,PHT,"F")}
        var bx=x+2.5;
        [[p.isNew,"NOVIDADE",ACC],[p.soldOut,"ESGOTADO",INK]].forEach(function(b){if(!b[0])return;doc.setFontSize(6.5);var w=doc.getTextWidth(b[1])+5;doc.setFillColor.apply(doc,b[2]);doc.roundedRect(bx,cy+2.5,w,5,2.5,2.5,"F");doc.setTextColor(255,248,244);doc.text(b[1],bx+2.5,cy+6);bx+=w+2});
        var ty=cy+PHT+5.5;
        doc.setTextColor.apply(doc,INK);doc.setFont("helvetica","bold");doc.setFontSize(10);
        var nl=doc.splitTextToSize(p.name,CW).slice(0,2);doc.text(nl,x,ty);ty+=nl.length*4.3+0.8;
        doc.setFontSize(10);
        if(p.price==null){doc.setFont("helvetica","normal");doc.setTextColor.apply(doc,MUT);doc.setFontSize(9);doc.text("Consulte o valor",x,ty)}
        else if(p.promo!=null&&p.promo<p.price){doc.setFont("helvetica","normal");doc.setTextColor.apply(doc,MUT);doc.setFontSize(8.5);var old=money(p.price),ow=doc.getTextWidth(old);doc.text(old,x,ty);doc.setDrawColor.apply(doc,MUT);doc.line(x,ty-1.2,x+ow,ty-1.2);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor.apply(doc,ACC);doc.text(money(p.promo),x+ow+2,ty)}
        else{doc.setFont("helvetica","bold");doc.setTextColor.apply(doc,INK);doc.text(money(p.price),x,ty)}
        ty+=5;
        var dx=x+1.6;p.colors.slice(0,8).forEach(function(cl){doc.setFillColor.apply(doc,rgb(cl.h));doc.setDrawColor(200,185,180);doc.setLineWidth(.2);doc.circle(dx,ty-1.2,1.6,"FD");dx+=4.4});
        if(p.colors.length){ty+=4;doc.setFont("helvetica","normal");doc.setFontSize(7);doc.setTextColor.apply(doc,MUT);var cn=doc.splitTextToSize(p.colors.map(function(c){return c.n}).join(" · "),CW)[0];doc.text(cn,x,ty);}
        if(p.sizes.length){ty+=3.8;doc.setFontSize(7);doc.setTextColor.apply(doc,MUT);doc.text("Tam. "+p.sizes.join(" · "),x,ty)}
        col++;if(col===3){col=0;y+=CH+6}
      });
    });
    var fname="catalogo-"+(s.storeName||"loja").toLowerCase().replace(/[^a-z0-9]+/g,"-")+(ui.cat!=="Todos"?"-"+ui.cat.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-"):"")+".pdf";
    doc.save(fname);
  });
}
var pdfBusy=false;
function pdfClick(){
  if(pdfBusy) return; pdfBusy=true;
  var busy=document.createElement("div");busy.className="busy";busy.textContent="Montando o PDF…";document.body.appendChild(busy);
  makePdf().catch(function(){toast("Não consegui montar o PDF. Verifique a internet e tente de novo.")}).then(function(){pdfBusy=false;busy.remove()});
}

var toastT;
function toast(m){var old=document.querySelector(".toast");if(old)old.remove();var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=m;document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},3200)}

/* ---------- events ---------- */
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ui.q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener("change",function(e){
  if(e.target.id==="ephoto"){
    var st=ui.sheet, files=Array.prototype.slice.call(e.target.files||[]); if(!files.length) return;
    readEditFields(); st.uploading=true; st.photoErr=""; renderSheet();
    var bad=0;
    files.reduce(function(pr,f){return pr.then(function(){return resizeFile(f).then(function(data){var id="ph"+uid();st.newPhotos[id]=data;st.draft.photos.push(id)},function(){bad++})})},Promise.resolve())
    .then(function(){st.uploading=false;if(bad)st.photoErr=bad+" foto(s) não abriram. Use JPG ou PNG (no iPhone, envie como “Mais compatível”).";renderSheet()});
  }
});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]"); if(!b) return;
  var a=b.getAttribute("data-a"), id=b.getAttribute("data-id"), st=ui.sheet;
  switch(a){
    case "cat": ui.cat=b.getAttribute("data-v"); ss("rfit-ui",{admin:ui.admin,cat:ui.cat}); render(); break;
    case "pdf": pdfClick(); break;
    case "toggleAdmin": ui.admin=!ui.admin; ss("rfit-ui",{admin:ui.admin,cat:ui.cat}); render(); break;
    case "open": ui.sheet={type:"detail",id:id,qty:1,color:null,size:null}; var p0=pById(id); if(p0&&p0.colors.length===1)ui.sheet.color=p0.colors[0].n; if(p0&&p0.sizes.length===1)ui.sheet.size=p0.sizes[0]; renderSheet(); break;
    case "close": closeSheet(); break;
    case "thumb": var car=sheetEl.querySelector(".car"); car.scrollTo({left:car.clientWidth*+b.getAttribute("data-i")+6*+b.getAttribute("data-i"),behavior:"smooth"}); break;
    case "pickColor": st.color=b.getAttribute("data-v"); renderSheet(); break;
    case "pickSize": st.size=b.getAttribute("data-v"); renderSheet(); break;
    case "qty": st.qty=Math.max(1,Math.min(20,st.qty+ +b.getAttribute("data-d"))); renderSheet(); break;
    case "addBag":
      var ex=ui.bag.filter(function(x){return x.pid===st.id&&x.color===st.color&&x.size===st.size})[0];
      if(ex) ex.qty+=st.qty; else ui.bag.push({pid:st.id,color:st.color,size:st.size,qty:st.qty});
      ss("rfit-bag",ui.bag); ui.sheet=null; render(); toast("Colocado na sacola"); break;
    case "bag": ui.sheet={type:"bag"}; renderSheet(); break;
    case "rmBag": ui.bag.splice(+b.getAttribute("data-i"),1); ss("rfit-bag",ui.bag); render(); if(ui.bag.length){ui.sheet={type:"bag"};renderSheet()} break;
    case "clearBag": ui.bag=[]; ss("rfit-bag",ui.bag); ui.sheet=null; render(); break;
    case "new": startEdit(null); break;
    case "edit": startEdit(pById(id)); break;
    case "settings": ui.sheet={type:"settings",draft:Object.assign({},STATE.settings)}; renderSheet(); break;
    case "eSize": readEditFields(); var v=b.getAttribute("data-v"),i=st.draft.sizes.indexOf(v); if(i>-1)st.draft.sizes.splice(i,1); else {st.draft.sizes.push(v); st.draft.sizes.sort(function(x,y){var a1=SIZES.indexOf(x),b1=SIZES.indexOf(y);return (a1<0?99:a1)-(b1<0?99:b1)})} renderSheet(); break;
    case "cAdd": readEditFields(); st.draft.colors.push({n:"",h:"#9a7b6f"}); renderSheet(); var last=document.getElementById("ec-n-"+(st.draft.colors.length-1)); if(last)last.focus(); break;
    case "cDel": readEditFields(); st.draft.colors.splice(+b.getAttribute("data-i"),1); renderSheet(); break;
    case "phDel": readEditFields(); st.draft.photos.splice(+b.getAttribute("data-i"),1); renderSheet(); break;
    case "phCover": readEditFields(); var k=+b.getAttribute("data-i"); st.draft.photos.unshift(st.draft.photos.splice(k,1)[0]); renderSheet(); break;
    case "del": st.confirmDel=true; renderSheet(); break;
    case "delNo": st.confirmDel=false; renderSheet(); break;
    case "delYes": var n1=cloneState(); n1.products=n1.products.filter(function(p){return p.id!==st.draft.id}); commit(n1,"Peça excluída"); break;
    case "dup": readEditFields(); var cp=JSON.parse(JSON.stringify(st.draft)); var nps=st.newPhotos; cp.id=uid(); cp.name=(cp.name||"Peça")+" (cópia)"; ui.sheet={type:"edit",isNew:true,draft:cp,newPhotos:nps}; renderSheet(); toast("Cópia criada. Ajuste e salve."); break;
    case "save":
      readEditFields(); var d=st.draft;
      if(!d.name){st.err="Dê um nome para a peça.";renderSheet();break}
      d.colors=d.colors.filter(function(c){return c.n});
      if(d.promo!=null && (d.price==null||d.promo>=d.price)) d.promo=null;
      var n2=cloneState(); Object.keys(st.newPhotos).forEach(function(k){if(d.photos.indexOf(k)>-1)n2.photos[k]=st.newPhotos[k]});
      var ix=-1; n2.products.forEach(function(p,j){if(p.id===d.id)ix=j});
      if(ix>-1) n2.products[ix]=d; else n2.products.unshift(d);
      commit(n2,st.isNew?"Peça adicionada ao catálogo":"Alterações salvas"); break;
    case "saveSettings":
      var g=function(x){return document.getElementById(x).value.trim()};
      var n3=cloneState(); n3.settings={storeName:g("s-name")||"R.FIT",tagline:g("s-tag"),notice:g("s-notice"),whatsapp:g("s-wa").replace(/\D/g,""),instagram:g("s-ig")};
      commit(n3,"Dados da loja salvos"); break;
    case "quick": var n4=cloneState(); n4.products.forEach(function(p){if(p.id===id)p[b.getAttribute("data-k")]=!p[b.getAttribute("data-k")]}); commit(n4,"Atualizado"); break;
    case "move":
      var n5=cloneState(), arr=n5.products, from=-1; arr.forEach(function(p,j){if(p.id===id)from=j});
      var vis=visible().map(function(p){return p.id}), vi=vis.indexOf(id), tgtId=vis[vi+ +b.getAttribute("data-d")];
      if(!tgtId) break; var to=-1; arr.forEach(function(p,j){if(p.id===tgtId)to=j});
      var item=arr.splice(from,1)[0]; arr.splice(to,0,item); commit(n5,"Ordem atualizada"); break;
  }
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ui.sheet)closeSheet()});

function logout(){token=null;ls("rfit-token",null);ui.canEdit=false;ui.admin=false;if(location.hash==="#admin")history.replaceState(null,"",location.pathname);render()}
function boot(){
  var p = token ? loadAdmin().catch(function(e){ if(e.status===401||e.status===403){logout()} return loadPublic() }) : loadPublic();
  return p.then(function(d){STATE=d;loaded=true;
      if(token){ui.canEdit=true;ui.admin=true}
      render();
    },function(){loaded=true;render();toast("Não consegui carregar o catálogo. Verifique a internet.")});
}
function loginHtml(st){
  return '<div class="sheet narrow" role="dialog" aria-label="Entrar"><div class="shead"><h2>Modo edição</h2><button class="x" data-a="close" aria-label="Fechar">×</button></div><div class="sbody">'+
  '<p class="hint">Cole a chave de acesso do GitHub (começa com <b>github_pat_</b>). Ela fica salva só neste aparelho.</p>'+
  '<div class="f"><label for="tok">Chave de acesso</label><input class="in" id="tok" autocomplete="off" spellcheck="false" placeholder="github_pat_..."></div>'+
  (st.err?'<p class="err">'+esc(st.err)+'</p>':'')+
  '</div><div class="foot"><span class="grow"></span><button class="big" style="width:auto" data-a="doLogin">'+(st.busy?'Conferindo…':'Entrar')+'</button></div></div>';
}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]"); if(!b) return; var a=b.getAttribute("data-a");
  if(a==="doLogin"){
    var v=(document.getElementById("tok").value||"").trim(); if(!v) return;
    ui.sheet.busy=true;ui.sheet.err="";renderSheet();
    token=v;
    gh("https://api.github.com/repos/"+REPO).then(function(r){
      if(!r.permissions||!r.permissions.push) throw {status:403};
      ls("rfit-token",token);ui.sheet=null;return boot().then(function(){toast("Pronto! Você está no modo edição.")});
    }).catch(function(){token=null;ui.sheet={type:"login",err:"Essa chave não funcionou. Confira se copiou inteira e se ela tem permissão de escrita no rfit-catalogo."};renderSheet()});
  }
  if(a==="logout") logout();
});
render();
var deferredPrompt=null;
function standalone(){try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function canInstall(){return !standalone() && (deferredPrompt || isIOS())}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;render()});
window.addEventListener("appinstalled",function(){deferredPrompt=null;render();toast("App R.FIT instalado!")});
function iosHtml(){
  return '<div class="sheet narrow" role="dialog" aria-label="Instalar app"><div class="shead"><h2>Instalar o app R.FIT</h2><button class="x" data-a="close" aria-label="Fechar">×</button></div><div class="sbody">'+
